labels:
  - name: more-info-needed
    labeled:
      issue:
        body: |
          Thanks for submitting your issue! It looks like there is not enough detail given for us to be able to troubleshoot.

          If you want us to troubleshoot the issue, we need more information.

          Once we have more information, or a PR to evaluate, we will follow up further on this ticket. Thanks!
      pr:
        body: |
          Thanks for submitting your PR! It looks like there is not enough detail given for us to be able to evaluate it.

          Once we have more information, we will follow up further on this PR. Thanks!
  - name: too-long
    labeled:
      issue:
        body: |
          This issue is too long to review as written, so it has not been read.

          A report is only useful if it can be understood quickly, so please edit this one down to the essentials. If an AI tool helped write it, that's fine, but verify it and trim it yourself first. If you haven't read it in full, it's simply not reasonable to expect us to.

          This issue will be reopened once it is evident it has had a human touch.
        action: close
      pr:
        body: |
          This PR's description is too long to review as written, so it has not been read.

          A change is only reviewable if it can be understood quickly, so please edit the description down to the essentials. If an AI tool helped write it, that's fine, but verify it and trim it yourself first. If you haven't read it in full, it's simply not reasonable to expect us to.

          This PR will be reopened once it is evident it has had a human touch.
        action: close
