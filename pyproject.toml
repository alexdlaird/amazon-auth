[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-auth"
dynamic = ["version"]
description = "Amazon sign-in and session handling, being extracted from amazon-orders. Not ready for use yet."
readme = "README.md"
license = "MIT"
keywords = ["amazon", "auth", "sign-in", "session"]
authors = [{ name = "Alex Laird", email = "contact@alexlaird.com" }]
maintainers = [{ name = "Alex Laird", email = "contact@alexlaird.com" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Sponsor = "https://github.com/sponsors/alexdlaird"
"Source Code" = "https://github.com/alexdlaird/amazon-auth"

[tool.setuptools]
package-dir = { amazonauth = "amazonauth" }

[tool.setuptools.dynamic]
version = { attr = "amazonauth.__version__" }
